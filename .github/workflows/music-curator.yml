name: Music Caption Curator

on:
  schedule:
    - cron: '30 22 * * *'  # ~2:00 AM Tehran time (UTC+3:30)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build captions and print them without editing Telegram'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decrypt state
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -f "music_state.enc" ]; then
            openssl aes-256-cbc -d -pbkdf2 -md sha256 -in music_state.enc -out music_state.tar.gz -pass pass:"$DB_PASSWORD"
            tar -xzf music_state.tar.gz
          fi

      - name: Run curator
        env:
          MUSIC_BOT_TOKEN: ${{ secrets.MUSIC_BOT_TOKEN }}
          MUSIC_CHANNEL_ID: ${{ secrets.MUSIC_CHANNEL_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scripts/music_curator.py --dry-run
          else
            python scripts/music_curator.py
          fi

      - name: Encrypt and commit state
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          STATE_FILES=""
          [ -f music_state.json ] && STATE_FILES="$STATE_FILES music_state.json"
          [ -f hashtag_index.json ] && STATE_FILES="$STATE_FILES hashtag_index.json"

          if [ -n "$STATE_FILES" ]; then
            tar -czf music_state.tar.gz $STATE_FILES
            openssl aes-256-cbc -salt -pbkdf2 -md sha256 -in music_state.tar.gz -out music_state.enc -pass pass:"$DB_PASSWORD"
            rm -f music_state.json hashtag_index.json music_state.tar.gz

            git add music_state.enc
          fi

          # Plaintext on purpose — just hashtag counts, nothing sensitive,
          # and being able to read it directly on GitHub without
          # decrypting anything is the whole point of this file.
          if [ -f hashtag_summary.txt ]; then
            git add hashtag_summary.txt
          fi

          if ! git diff --cached --quiet; then
            git commit -m "chore: update music curator state (encrypted) + hashtag summary"
            git pull --rebase origin main || true
            git push
          else
            echo "No state changes to commit."
          fi