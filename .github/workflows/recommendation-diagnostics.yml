name: Recommendation diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check previously affected tracks without posting to Telegram
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python -u scripts/check_recommendations.py
